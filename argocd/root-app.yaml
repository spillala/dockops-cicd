apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dockops-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/spillala/dockops-cicd.git
    targetRevision: main
    # App-of-apps root: every *-app.yaml Application manifest dropped in this
    # directory (including this file itself) gets applied automatically on
    # the next sync — no manual `kubectl apply` needed for new apps after
    # this root is bootstrapped once.
    path: argocd
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
