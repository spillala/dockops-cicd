# ============================================================
#  DockOps — Infrastructure CI/CD Pipeline
#  Validates and deploys K8s manifests separately from app code.
#  AI agent verifies cluster health after every infra change.
#  Provider is pluggable: Anthropic Claude by default, or any
#  OpenAI-compatible endpoint (Ollama, vLLM, LocalAI, ...) via
#  the AI_VERIFY_PROVIDER repo variable — see README.md.
# ============================================================

name: Infrastructure CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - "helm/**"
      - "!helm/dronefleet/values.yaml"
      - ".github/workflows/infra-cicd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "k8s/**"
      - "helm/**"
      - "!helm/dronefleet/values.yaml"

env:
  K8S_NAMESPACE: dronefleet

jobs:

  # ── VALIDATE ────────────────────────────────────────────────
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          # kubectl for dry-run
          curl -sLO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

          # kubeconform for schema validation
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Schema validation with kubeconform
        run: |
          find k8s/ -name "*.yaml" | xargs kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.0

      - name: Dry-run apply
        run: |
          kubectl apply --dry-run=client -f k8s/base/deployment.yaml

  # ── DEPLOY INFRA ────────────────────────────────────────────
  deploy-infra:
    name: Deploy infra changes
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply infra changes
        run: |
          kubectl apply -f k8s/base/ -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for stability
        run: |
          sleep 15
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

  # ── AI VERIFICATION ─────────────────────────────────────────
  ai-verify:
    name: AI cluster health check
    runs-on: ubuntu-latest
    needs: deploy-infra
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Collect cluster state
        id: cluster-state
        run: |
          echo "Collecting cluster state for AI verification..."

          PODS=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o json)
          EVENTS=$(kubectl get events -n ${{ env.K8S_NAMESPACE }} \
            --sort-by='.lastTimestamp' | tail -20)
          DEPLOY=$(kubectl get deployment dronefleet \
            -n ${{ env.K8S_NAMESPACE }} -o json 2>/dev/null || echo "{}")

          # Write state to file for AI agent
          cat > /tmp/cluster-state.json << EOF
          {
            "namespace": "${{ env.K8S_NAMESPACE }}",
            "trigger": "infra_cicd",
            "commit": "${{ github.sha }}",
            "pods": $PODS,
            "deployment": $DEPLOY,
            "recent_events": "$(echo "$EVENTS" | sed 's/"/\\"/g')"
          }
          EOF
          echo "State collected."

      - name: Run AI health verification
        env:
          # 'anthropic' (default, needs ANTHROPIC_API_KEY) or 'openai_compatible' —
          # the latter talks to any server that speaks the OpenAI chat-completions
          # schema: Ollama, vLLM, LocalAI, LM Studio, text-generation-webui, etc.
          # Switch providers with a repo variable, no code change required.
          AI_VERIFY_PROVIDER: ${{ vars.AI_VERIFY_PROVIDER || 'anthropic' }}
          AI_VERIFY_MODEL: ${{ vars.AI_VERIFY_MODEL }}
          AI_VERIFY_BASE_URL: ${{ vars.AI_VERIFY_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, os, sys

          DEFAULT_MODELS = {
              "anthropic": "claude-sonnet-4-20250514",
              "openai_compatible": "llama3.1",
          }
          DEFAULT_BASE_URLS = {
              "openai_compatible": "http://localhost:11434/v1",
          }

          provider = os.environ.get("AI_VERIFY_PROVIDER", "anthropic").strip().lower()
          if provider not in DEFAULT_MODELS:
              print(f"AI_VERIFY_PROVIDER={provider!r} is not 'anthropic' or "
                    f"'openai_compatible' — skipping AI verification")
              sys.exit(0)

          model = os.environ.get("AI_VERIFY_MODEL") or DEFAULT_MODELS[provider]

          with open("/tmp/cluster-state.json") as f:
              state = f.read()

          prompt = f"""You are DockOps AI SRE. Analyse this Kubernetes cluster state after an infra deployment.

          Cluster state:
          {state}

          Check for:
          1. Any pods in CrashLoopBackOff, Pending, or Error state
          2. Any OOMKilled containers
          3. Recent Warning events that indicate problems
          4. Deployment replicas ready vs desired

          Respond ONLY with valid JSON in this format:
          {{
            "verdict": "PASS" or "FAIL",
            "issues": ["list of issues found, empty if none"],
            "recommendation": "brief action if FAIL, or 'No action needed' if PASS"
          }}"""

          def call_anthropic():
              api_key = os.environ.get("ANTHROPIC_API_KEY", "")
              if not api_key:
                  print("ANTHROPIC_API_KEY not set — skipping AI verification")
                  sys.exit(0)
              payload = json.dumps({
                  "model": model,
                  "max_tokens": 1000,
                  "messages": [{"role": "user", "content": prompt}],
              }).encode()
              req = urllib.request.Request(
                  "https://api.anthropic.com/v1/messages",
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "x-api-key": api_key,
                      "anthropic-version": "2023-06-01",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read())
                  return data["content"][0]["text"]

          def call_openai_compatible():
              base_url = (os.environ.get("AI_VERIFY_BASE_URL") or DEFAULT_BASE_URLS[provider]).rstrip("/")
              api_key = os.environ.get("OPENAI_API_KEY", "")  # most self-hosted servers don't need one
              headers = {"Content-Type": "application/json"}
              if api_key:
                  headers["Authorization"] = f"Bearer {api_key}"
              payload = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": prompt}],
                  "stream": False,
              }).encode()
              req = urllib.request.Request(f"{base_url}/chat/completions", data=payload, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.loads(resp.read())
                  return data["choices"][0]["message"]["content"]

          try:
              text = call_anthropic() if provider == "anthropic" else call_openai_compatible()
              result = json.loads(text)

              print(f"Provider: {provider} ({model})")
              print(f"AI Verdict: {result['verdict']}")
              if result["issues"]:
                  print("Issues found:")
                  for issue in result["issues"]:
                      print(f"  - {issue}")
              print(f"Recommendation: {result['recommendation']}")

              if result["verdict"] == "FAIL":
                  print("AI verification FAILED — check issues above")
                  sys.exit(1)
              else:
                  print("AI verification PASSED — cluster is healthy")

          except SystemExit:
              raise
          except Exception as e:
              print(f"AI verification error: {e} — continuing without AI check")
              sys.exit(0)
          PYEOF

      - name: Verification summary
        if: always()
        run: |
          echo "### Infra Deploy + AI Verification Complete" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
