namespace: px4-sitl-gazebo
replicaCount: 1
image:
  # Official prebuilt PX4 SITL + Gazebo Harmonic image — nothing is compiled
  # in-cluster or at image-build time. Pinned (not :latest) for reproducibility;
  # bump manually when a newer PX4 release is wanted.
  repository: px4io/px4-sitl-gazebo
  tag: "v1.18.0-beta2"
  pullPolicy: IfNotPresent
simModel: gz_x500
gzWorld: "" # empty = image default world
mavlink:
  port: 14550
service:
  # ClusterIP by default; switch to NodePort if you need QGroundControl or
  # another MAVLink client reachable directly from the host.
  type: ClusterIP
resources:
  # Measured from a headless smoke test on this cluster's node (12 CPU /
  # ~15Gi allocatable, shared with dronefleet + dronefleet-agent/ollama):
  # idle single-vehicle sim runs ~150Mi RSS. Limits leave headroom for
  # sensors/rendering load without being able to repeat the from-source
  # build's swap-thrashing incident (see PX4-Autopilot repo history).
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1536Mi
mavlinkBridge:
  enabled: true
  image:
    repository: ghcr.io/spillala/mavlink-bridge
    # !! THIS FIELD IS MANAGED BY CI !!
    # mavlink-bridge-cicd.yml updates this via yq on every successful build.
    tag: "e2c8887"
    pullPolicy: IfNotPresent
  # Which dronefleet drone this MAVLink system reports as. There's exactly
  # one simulated vehicle today; multi-vehicle mapping is a Phase E concern.
  droneId: "drone-004"
  dronefleetUrl: http://dronefleet-svc.dronefleet:80
  heartbeatStale: 10s
  healthPort: 8082
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
