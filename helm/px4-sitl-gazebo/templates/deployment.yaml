apiVersion: apps/v1
kind: Deployment
metadata:
  name: px4-sitl-gazebo
  namespace: {{ .Values.namespace }}
  labels:
    app: px4-sitl-gazebo
    part-of: dockops
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: px4-sitl-gazebo
  template:
    metadata:
      labels:
        app: px4-sitl-gazebo
    spec:
      containers:
        - name: px4-sitl-gazebo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HEADLESS
              value: "1"
            - name: PX4_SIM_MODEL
              value: {{ .Values.simModel | quote }}
            {{- if .Values.gzWorld }}
            - name: PX4_GZ_WORLD
              value: {{ .Values.gzWorld | quote }}
            {{- end }}
          ports:
            - name: mavlink
              containerPort: {{ .Values.mavlink.port }}
              protocol: UDP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
