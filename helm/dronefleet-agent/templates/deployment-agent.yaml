apiVersion: apps/v1
kind: Deployment
metadata:
  name: dronefleet-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: dronefleet-agent
    part-of: dockops
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      app: dronefleet-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dronefleet-agent
    spec:
      {{- with .Values.agent.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dronefleet-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - -dronefleet-url={{ .Values.agent.dronefleetUrl }}
            - -ollama-url={{ .Values.agent.ollamaUrl }}
            - -model={{ .Values.agent.ollamaModel }}
            - -watch={{ .Values.agent.watchInterval }}
            - -health-addr=:{{ .Values.agent.healthPort }}
          ports:
            - containerPort: {{ .Values.agent.healthPort }}
              name: health
          livenessProbe:
            {{- toYaml .Values.agent.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.agent.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
