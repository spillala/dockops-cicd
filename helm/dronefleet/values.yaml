replicaCount: 2
image:
  repository: ghcr.io/spillala/dronefleet
  # !! THIS FIELD IS MANAGED BY CI !!
  # drone-app-cicd.yml updates this via yq on every successful build.
  # Do not change manually — your change will be overwritten on next deploy.
  tag: "1aea1dd"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull-secret
nameOverride: ""
fullnameOverride: "dronefleet"
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
env:
  APP_ENV: production
  APP_PORT: "8080"
  LOG_LEVEL: info
  MAX_FLEET_SIZE: "50"
  TELEMETRY_BUFFER: "100"

postgres:
  enabled: true
  image: postgres:16-alpine
  database: dronefleet
  user: dronefleet
  storage: 2Gi
  # Created out-of-band via scripts/create-postgres-secret.sh, same pattern
  # as ghcr-pull-secret — never commit the password or database-url here.
  # Must contain keys "postgres-password" and "database-url".
  secretName: dronefleet-postgres-secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5
namespace: dronefleet
