{{- if .Values.postgres.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: dronefleet-migrate-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    app: dronefleet-migrate
    part-of: dockops
  annotations:
    # Runs after Postgres and dronefleet are created/updated by this same
    # release, same convention as dronefleet-agent's ollama model-pull job:
    # the wait-for initContainer covers the race, rather than hook-ordering
    # against normal (non-hook) resources.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dronefleet-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z dronefleet-postgres-svc 5432; do echo waiting for postgres; sleep 3; done
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/migrate", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: database-url
{{- end }}
